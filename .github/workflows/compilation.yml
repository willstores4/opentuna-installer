name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [run_build]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile
        run: |
          docker run --rm -v "$PWD:/src" -w /src ps2dev/ps2dev:v1.2.0 sh -c \
            "apk add build-base git zip && git config --global --add safe.directory /src && make"

      - name: Get short SHA
        id: slug
        run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenTuna_WILL_Installer_${{ steps.slug.outputs.sha8 }}
          path: OpenTuna_WILL_Installer.elf

      - name: Create release
        if: github.ref == 'refs/heads/main'
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          title: "Latest build"
          files: OpenTuna_WILL_Installer.elf
